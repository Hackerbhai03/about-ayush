<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="50%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)" />

  <!-- Ambient glowing spheres -->
  <circle cx="200" cy="100" r="150" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="180" fill="#06b6d4" opacity="0.1" filter="url(#glow)" />

  <!-- Grid lines -->
  <g stroke="#8b5cf6" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Content -->
  <text x="600" y="140" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="700" fill="#38bdf8" letter-spacing="4">
    // TELEGRAM BOT ARCHITECT &amp; WEB DEVELOPER
  </text>

  <text x="600" y="215" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="1">
    AYUSH <tspan fill="url(#textGrad)">// KANHA</tspan>
  </text>

  <text x="600" y="270" text-anchor="middle" font-family="monospace" font-size="16" fill="#94a3b8" letter-spacing="2">
    @Hackerbhai03 • Telegram Automation • Community Safety • High-Speed APIs
  </text>

  <!-- Status pill -->
  <g transform="translate(480, 310)">
    <rect width="240" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <circle cx="24" cy="18" r="5" fill="#10b981" />
    <text x="40" y="23" font-family="monospace" font-size="12" fill="#e2e8f0" font-weight="600">SYSTEM OPERATIONAL</text>
  </g>
</svg>
